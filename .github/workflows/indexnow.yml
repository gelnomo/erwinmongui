# Tells Bing (and the other IndexNow search engines) which pages changed, so
# they re-crawl them within days instead of weeks. https://www.indexnow.org/
#   - On every push to main it submits the pages that push changed, after
#     GitHub Pages has published them.
#   - Run it from the Actions tab to submit every URL in sitemap.xml.
# The key is the <32 hex characters>.txt file at the site root. Search engines
# fetch it to check that the submission comes from the site owner.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, re, subprocess, sys, time, urllib.request

          SITE = "https://erwinmongui.com"
          keys = [f for f in os.listdir(".") if re.fullmatch(r"[0-9a-f]{32}\.txt", f)]
          if len(keys) != 1:
              sys.exit(f"Expected one IndexNow key file at the root, found {keys}")
          key = keys[0][:-4]

          def all_urls():
              return re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())

          before = os.environ.get("BEFORE", "")
          if os.environ["EVENT"] != "push" or not before or set(before) == {"0"}:
              urls, files = all_urls(), []
          else:
              changed = subprocess.run(["git", "diff", "--name-only", before, "HEAD"],
                                       capture_output=True, text=True, check=True).stdout.split()
              files = [f for f in changed if f.endswith(".html") and os.path.exists(f)
                       and not f.startswith(("src/", ".github/")) and f != "404.html"]
              urls = [SITE + "/" + (f[:-len("index.html")] if f.endswith("index.html") else f) for f in files]
              if "sitemap.xml" in changed and not urls:
                  urls = all_urls()
          if not urls:
              print("No public pages changed.")
              sys.exit(0)

          # Wait until GitHub Pages serves the new version of the first changed page.
          if files:
              want = hashlib.sha256(open(files[0], "rb").read()).hexdigest()
              for _ in range(40):
                  try:
                      body = urllib.request.urlopen(urls[0] + "?indexnow=" + str(time.time()), timeout=20).read()
                      if hashlib.sha256(body).hexdigest() == want:
                          print("Live:", urls[0])
                          break
                  except Exception as e:
                      print("Waiting:", e)
                  time.sleep(15)
              else:
                  print("The site did not update within 10 minutes; submitting anyway.")

          payload = {"host": "erwinmongui.com", "key": key,
                     "keyLocation": f"{SITE}/{key}.txt", "urlList": urls[:10000]}
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
                                       data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              status = urllib.request.urlopen(req, timeout=30).status
          except urllib.error.HTTPError as e:
              sys.exit(f"IndexNow refused the submission: HTTP {e.code} {e.read().decode()[:300]}")
          print(f"IndexNow answered HTTP {status} for {len(urls)} URLs:")
          print("\n".join(urls))
          EOF
